# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.json
#
# pdf-sign-linux's CodeRabbit settings, from github-template, aligned with
# the org-wide merge pipeline documented in docs/MERGE_PIPELINE.md: this
# repo's own `Review Verified` context depends on both settings below being
# exactly what they say. Tune the tools block once you know what pre-commit
# hooks this repo actually runs: anything enabled twice (once as a
# pre-commit hook, once as a CodeRabbit tool) reviews the same finding twice
# for no benefit.

language: en-US

reviews:
  auto_review:
    # Never stop reviewing a branch for being busy. The default is 5, which
    # pauses automatic reviews once five commits on a branch have been
    # reviewed, and the pause is silent: the CodeRabbit check still reports
    # green, so the pull request looks reviewed when nothing has read its
    # current head. See rsync-crypt's .coderabbit.yaml for where this was
    # first found and fixed (pre-commit-checklists#12, twelve hours with no
    # review of the current head and no visible sign anything was waiting).
    auto_pause_after_reviewed_commits: 0

    # CodeRabbit is a GitHub App posting a check, not a workflow job, so it
    # cannot be ordered after pre-commit with a needs: dependency the way a
    # workflow job can. Skipping drafts is the lever instead: open a pull
    # request as a draft, let pre-commit finish, then mark it ready. This
    # is the default, stated explicitly here because both the review order
    # and docs/MERGE_PIPELINE.md's `Review Verified` draft lane depend on
    # it.
    drafts: false
  # tools: is commented out entirely, deliberately. Left present with
  # nothing under it, YAML parses it as null rather than an empty object,
  # and CodeRabbit rejects the file with "expected object, received null at
  # reviews.tools" then silently falls back to its defaults, so the rest of
  # this config never applies. Uncomment the key together with at least one
  # tool when disabling something that duplicates a pre-commit hook this
  # repo already runs, for example:
  # tools:
  #   yamllint:
  #     enabled: false
  #   markdownlint:
  #     enabled: false

  # How hard to look. assertive raises more than chill does; this
  # repository runs an unpatched 2012 Reader on people's signatures and
  # private documents, kept safe only by the container's isolation, so a
  # missed edge case costs more than an extra comment.
  profile: assertive

  # Review guidance. The first entry is the organization's public-repository
  # rules, kept the same in every ivan-pinatti-labs repository; the rest are
  # specific to pdf-sign-linux. Pre-commit already runs the linters, so these
  # ask for judgment the hooks cannot make.
  path_instructions:
    - path: "**"
      instructions: |
        This repository is public. Flag, as a blocking issue, anything in the
        diff that should not be published:
        - secrets, tokens, keys, passwords, session cookies, connection
          strings, or anything that looks like one, even in tests or docs;
        - personal data: names other than the maintainer's public handle,
          email addresses other than a users.noreply.github.com one, phone
          numbers, physical addresses;
        - machine specific details: absolute home paths (/home/<user>,
          /Users/<user>), host names, LAN or private IP addresses, internal
          domains, cloud account IDs, ARNs, AWS profile names, cluster
          contexts, and details of anyone's own deployment;
        - AI attribution in any file, commit message or the pull request
          text: a Co-Authored-By trailer naming an AI agent, a "Generated
          with" line, an agent session link, or any other line that names
          or links the agent that wrote the change.
        Also check that every behavior change comes with tests that would
        fail without it, and that the docs describe the new behavior. The
        organization's rule is 100% test coverage of the code it ships:
        flag, as a blocking issue, any new or changed line or branch of code
        (not docs or configuration) that no test exercises, and name the
        test that would cover it. Do not comment on formatting the
        pre-commit hooks already enforce.
    - path: "**/*.md"
      instructions: |
        Prose does not use a hyphen, em dash or en dash as punctuation; use
        commas, parentheses or separate sentences (hyphens inside compound
        words, code, paths and flags are fine). Point out claims the code in
        this pull request does not back up.
    - path: "{pdf-sign,containers/reader/**}"
      instructions: |
        Reader XI is unpatched, so the container's isolation is the only
        protection (see the Isolation section of README.md). Flag any change
        that loosens it without a stated reason: network other than
        --network=none, a capability added back or no-new-privileges
        dropped, a mount beyond the inbox and the two state folders, any
        desktop access beyond the Wayland socket (X11, D-Bus, PipeWire,
        portals), WAYLAND_DISPLAY reaching anything but the private
        Xwayland, or SELinux confinement as pdf_sign_t switched off. Refusals
        must fail closed: an X11 session, or a missing SELinux module without
        PDF_SIGN_NO_SELINUX=1, has to stop the run, not fall back. The inbox
        and the state folders stay 0700 and what is written in them 0600.
        In the Containerfile, the small scripts are copied after the Reader
        install stage, so editing them does not reinstall Reader.
    - path: "selinux/**"
      instructions: |
        selinux/pdf_sign.cil is generated by selinux/generate.sh from
        generate.py: flag a change to the .cil that generate.py does not
        produce. pdf_sign_t is container_t plus exactly two permissions
        (writing to the compositor's socket file and connecting to the
        compositor); flag any rule that grants pdf_sign_t more than that.
    - path: "{inbox/**,**/*.pdf,.github/workflows/**}"
      instructions: |
        Only inbox/README.md is committed: flag any PDF or other document
        added anywhere in the repository. A built image contains Adobe
        Reader and Microsoft's fonts, whose licences forbid
        redistribution: flag any step that pushes or uploads the image or
        its layers (GHCR, Docker Hub, an artifact, a release asset), and any
        Adobe or Microsoft file committed to the repository.

  # Pull request checks shown in the walkthrough. Warnings, not errors: the
  # merge pipeline already gates on CodeRabbit's review through Review
  # Verified (docs/MERGE_PIPELINE.md).
  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits: type(optional scope): imperative subject,
        lowercase, no trailing period, at most 72 characters.
    description:
      mode: warning
    custom_checks:
      - name: Public repository hygiene
        mode: warning
        instructions: >-
          Fail if the diff, commit messages or pull request text add a
          secret or something that looks like one, an email address other
          than a users.noreply.github.com one, an absolute home path, a host
          name, a private IP address, a cloud account ID or ARN, or details
          of a personal deployment. Pass otherwise.
      - name: No AI attribution
        mode: warning
        instructions: >-
          Fail if any commit message, the pull request title or description,
          or any file in the diff contains a Co-Authored-By trailer naming an
          AI agent, a "Generated with" line, an agent session link, or any
          other line that names or links the AI agent that made the change.
          Pass otherwise.

# Tone of review comments and chat.
tone_instructions: >-
  Direct and specific: lead with the defect and a concrete fix, in plain
  words. No praise, no emoji, no hype. Skip style points a linter already
  reports.

# The repository's own rules, read as coding guidelines for every review.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - AGENTS.md
      - README.md
      - CONTRIBUTING.md
      - docs/MERGE_PIPELINE.md
