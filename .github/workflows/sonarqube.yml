name: SonarQube

# SonarQube Cloud static analysis of everything Sonar has an analyzer for:
# the shell scripts, the Python policy generator, the Containerfile, YAML and
# these workflows, plus secrets detection over every text file, with the
# test coverage of the Python and the shell. Settings live
# in sonar-project.properties. It sits next to the pre-commit hooks, it does
# not replace them: shellcheck, ruff, hadolint, actionlint and zizmor keep
# running on every commit through the library's checklists, and Sonar's rules
# are different from theirs, not a superset.
#
# The job fails when the SonarQube Cloud quality gate fails
# (`sonar.qualitygate.wait=true`), so the `SonarQube` check is the gate
# verdict itself, reported by GitHub Actions like `Pre-commit`.
# SonarQube Cloud's own GitHub App also posts a check on the pull request;
# that one is informational only, because it is never posted on a merge
# queue commit.
#
# Triggers:
#   pull_request   the analysis a reviewer reads, decorated onto the pull
#                  request by SonarQube Cloud.
#   push to main   the baseline every pull request's "new code" is measured
#                  against. Without it the gate has nothing to compare to.
#   merge_group    see the "Merge queue" step below.
"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: >-
    sonarqube-${{ github.event.pull_request.number ||
    github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: SonarQube
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Merge queue
        # Not analyzed. The queue's commit is main plus a pull request whose
        # own head was already analyzed and gated here, and SonarQube Cloud
        # has no pull request to attach a queue commit to, so an analysis
        # there would be a branch analysis of a throwaway
        # `gh-readonly-queue/...` branch. The push to main right after the
        # merge analyzes the real result. The step still has to run and pass,
        # or a required `SonarQube` check never appears on the queue's commit
        # and the queue stalls.
        if: github.event_name == 'merge_group'
        run: echo "Merge queue commit; the pull request head was already analyzed."

      - name: Refuse a fork's pull request
        # GitHub withholds SONAR_TOKEN from a fork's pull_request run, so the
        # scan cannot authenticate. Failing says so; passing would read as an
        # analysis that never happened. A maintainer pushes the contributor's
        # commits to a branch here and opens a pull request from that.
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::SonarQube cannot analyze a fork's pull request (no SONAR_TOKEN)." \
            "Push the branch to this repository instead."
          exit 1

      - name: Checkout
        if: github.event_name != 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: SonarQube Cloud reads blame to decide which lines
          # are new code, and a shallow clone makes every line look new.
          fetch-depth: 0

      # Coverage of the Python and the shell, held at 100% (see the
      # Makefile's `coverage` target). The quality gate also requires 80% on
      # new code, and with no report every new line would count as
      # uncovered. Both tools run in podman containers that see the source
      # only through a tar stream; the runner ships podman. The step is
      # allowed to fail so SonarQube still gets the report of a run that
      # falls short, and the last step below fails the job on it.
      - name: Measure coverage
        id: coverage
        if: github.event_name != 'merge_group'
        continue-on-error: true
        run: make coverage

      - name: Scan
        if: github.event_name != 'merge_group'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true

      - name: Require 100% coverage
        # After the scan, so a pull request below 100% still gets SonarQube's
        # report of which lines are missing. `make coverage` above printed
        # them too; this only carries its verdict.
        if: github.event_name != 'merge_group' && steps.coverage.outcome == 'failure'
        run: |
          echo "::error::Coverage is below 100%; see the Measure coverage step."
          exit 1
