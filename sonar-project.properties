# SonarQube Cloud analysis settings, read by .github/workflows/sonarqube.yml.
# The project is analyzed from CI with Automatic Analysis turned off in the
# project settings: the two cannot run side by side, and a CI scan aborts
# while Automatic Analysis is on.
sonar.organization=ivan-pinatti-labs
sonar.projectKey=ivan-pinatti-labs_pdf-sign-linux
sonar.projectName=pdf-sign-linux

# Sources are the whole tree rather than a list of files, so a new file is
# analyzed without anyone remembering to add it here. Sonar only reads the
# languages it has an analyzer for (shell, Python, the Containerfile and the
# devcontainer Dockerfile, YAML and GitHub Actions here) plus its secrets
# detection, which runs over every text file. The tests under tests/ are
# analyzed as tests, not as sources.
sonar.sources=.
sonar.tests=tests
sonar.test.inclusions=tests/**

# Excluded:
#   .secrets.baseline     generated by detect-secrets, only records hashes.
#   selinux/pdf_sign.cil  generated by selinux/generate.sh from generate.py,
#                         which is analyzed instead.
#   *.reg, *.ppd          Reader's registry defaults and the CUPS printer
#                         description: configuration data, not code.
#   inbox/**              where documents go in and out; only its README is
#                         committed.
#   tests/**              analyzed as tests instead (sonar.tests above).
#   coverage/**           the reports `make coverage` writes, never committed.
sonar.exclusions=.secrets.baseline,selinux/pdf_sign.cil,**/*.reg,**/*.ppd,inbox/**,tests/**,coverage/**

# Sonar picks a file's language by its extension alone, and three of the
# four shell scripts have none (everything else, shellcheck included, finds
# them by their shebang). Listing them here next to the default suffixes
# gets them analyzed as shell.
sonar.lang.patterns.shell=**/*.sh,**/*.bash,pdf-sign,containers/reader/start-reader,containers/reader/inbox-backend

# The interpreter CI runs, so rules that depend on the language version judge
# selinux/generate.py against it.
sonar.python.version=3.12

# Written by `make coverage` (sonarqube.yml's "Measure coverage" step), never
# committed. shell.xml is kcov's report of the four shell scripts, in
# SonarQube's generic coverage format, since SonarQube has no shell coverage
# importer; it names each script by its path from the repository root, the
# path the shell patterns above give it.
sonar.python.coverage.reportPaths=coverage/coverage.xml
sonar.coverageReportPaths=coverage/shell.xml

sonar.sourceEncoding=UTF-8
